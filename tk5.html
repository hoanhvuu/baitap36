<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TK5 - Accordion</title>
    <style>
        .accordion-title {
            background-color: #eee;
            color: #444;
            cursor: pointer;
            padding: 18px;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 15px;
        }
        .accordion-content {
            padding: 0 18px;
            background-color: white;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out;
        }
        .accordion-content.active {
            max-height: 200px;
        }
    </style>
</head>
<body>
    <h2>Bài tập TK5: Accordion đơn giản</h2>
    <button class="accordion-title">Tiêu đề Accordion</button>
    <div class="accordion-content">
        <p>Nội dung ẩn của accordion được hiển thị khi bấm vào tiêu đề.</p>
    </div>
    <script>
        const title = document.querySelector('.accordion-title');
        const content = document.querySelector('.accordion-content');
        title.addEventListener('click', function() {
            content.classList.toggle('active');
        });
    </script>
</body>
</html>
