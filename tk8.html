<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>K8 - Tính BMI</title>
</head>
<body>
    <h2>Bài tập K8: Tính Chỉ Số BMI và Phân Loại</h2>
    <label>Cân nặng (kg): </label>
    <input type="number" id="weight" step="0.1"><br><br>
    <label>Chiều cao (m): </label>
    <input type="number" id="height" step="0.01"><br><br>
    <button onclick="calculateBMI()">Tính BMI</button>
    <p id="result"></p>
    <script>
        function calculateBMI() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            if (!weight || !height || height <= 0) {
                document.getElementById('result').innerText = 'Vui lòng nhập giá trị hợp lệ';
                return;
            }
            const bmi = weight / (height * height);
            let category = '';
            if (bmi < 18.5) {
                category = 'Thiếu cân';
            } else if (bmi <= 24.9) {
                category = 'Bình thường';
            } else {
                category = 'Thừa cân';
            }
            document.getElementById('result').innerText = `BMI: ${bmi.toFixed(2)} - Phân loại: ${category}`;
        }
    </script>
</body>
</html>
