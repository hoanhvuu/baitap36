<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TK7 - Chuỗi Ngẫu Nhiên</title>
</head>
<body>
    <h2>Bài tập TK7: Tạo chuỗi ngẫu nhiên</h2>
    <button onclick="generateString()">Tạo Mật Khẩu</button>
    <p id="result"></p>
    <script>
        function generateRandomString() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }
        function generateString() {
            document.getElementById('result').innerText = generateRandomString();
        }
    </script>
</body>
</html>
